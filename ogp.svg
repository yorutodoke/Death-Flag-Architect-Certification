<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#1b2334" />
    </linearGradient>
    <pattern id="hazardPattern" width="30" height="30" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#ffb82e" stroke-width="15" />
      <line x1="15" y1="0" x2="15" y2="30" stroke="#141822" stroke-width="15" />
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- 上部ハザードバー -->
  <rect width="1200" height="12" fill="url(#hazardPattern)" />

  <!-- ゴールド外枠 -->
  <rect x="30" y="30" width="1140" height="570" rx="14" fill="none" stroke="#ffb82e" stroke-width="4" />
  <rect x="42" y="42" width="1116" height="546" rx="10" fill="none" stroke="rgba(255, 184, 46, 0.3)" stroke-width="1.5" />

  <!-- タイトル部 -->
  <text x="600" y="130" text-anchor="middle" fill="#ffb82e" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-weight="bold" font-size="22" letter-spacing="4">全日本フラグ建築業協会 公認</text>

  <text x="600" y="220" text-anchor="middle" fill="#ff3355" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-weight="900" font-size="64" letter-spacing="2">⚠️ 死亡フラグ建築検定 ⚠️</text>

  <text x="600" y="280" text-anchor="middle" fill="#94a3b8" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="22">― どんな窮地でも、芸術的な死亡フラグを建てられるか？ ―</text>

  <!-- 中央セリフボックス -->
  <rect x="150" y="330" width="900" height="150" rx="12" fill="rgba(10, 14, 22, 0.75)" stroke="#344059" stroke-width="2" />

  <text x="600" y="385" text-anchor="middle" fill="#ffb82e" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-weight="bold" font-size="24">「この戦いが終わったら…」「ここは俺に任せて先に行け！」</text>
  
  <text x="600" y="440" text-anchor="middle" fill="#ffffff" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="22">絶体絶命のセリフで、あなたの技能ランクを精密判定！</text>

  <!-- 角印スタンプ -->
  <g transform="translate(1000, 480) rotate(-12)">
    <rect x="-45" y="-45" width="90" height="90" rx="6" fill="rgba(255, 68, 68, 0.08)" stroke="#ff4444" stroke-width="3" />
    <text x="0" y="-12" text-anchor="middle" fill="#ff4444" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-weight="bold" font-size="20">建築</text>
    <text x="0" y="16" text-anchor="middle" fill="#ff4444" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-weight="bold" font-size="20">合格</text>
    <text x="0" y="34" text-anchor="middle" fill="#ff4444" font-family="'Hiragino Kaku Gothic ProN', sans-serif" font-size="11">協会之印</text>
  </g>

  <!-- フッター -->
  <text x="600" y="555" text-anchor="middle" fill="#ffb82e" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-weight="bold" font-size="20">#死亡フラグ建築検定</text>
</svg>
